name: ssh-deploy
description: Ask the deploy gate on a remote host to deploy a commit, over SSH with a pinned host key.

inputs:
  host:
    description: Remote hostname or IP.
    required: true
  port:
    description: Remote SSH port.
    required: false
    default: "22"
  user:
    description: Remote user.
    required: true
  key:
    description: Private key for the remote user. The host binds it to the deploy gate.
    required: true
  host-key:
    description: The host's public key as "<type> <base64>", for example "ssh-ed25519 AAAA…".
    required: true
  environment:
    description: Environment the gate deploys to, for example "production".
    required: true
  sha:
    description: Full 40-character commit sha to deploy.
    required: true
  envs:
    description: Comma- or newline-separated names of step env variables sent to the gate as JSON on stdin.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Request the deploy over SSH
      shell: bash
      env:
        SSH_DEPLOY_HOST: ${{ inputs.host }}
        SSH_DEPLOY_PORT: ${{ inputs.port }}
        SSH_DEPLOY_USER: ${{ inputs.user }}
        SSH_DEPLOY_KEY: ${{ inputs.key }}
        SSH_DEPLOY_HOST_KEY: ${{ inputs.host-key }}
        SSH_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        SSH_DEPLOY_SHA: ${{ inputs.sha }}
        SSH_DEPLOY_ENVS: ${{ inputs.envs }}
      run: '"$GITHUB_ACTION_PATH/ssh-deploy.sh"'
