name: zizmor

# Other repos call this workflow; it audits the calling repo's workflows, actions
# and dependabot config. Pinning zizmor here keeps one version across the org.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned: a replaced or added wheel on PyPI fails the install.
      # workspace:scripts/zizmor-all.sh reads this block, so keep the markers.
      - name: Install zizmor
        run: |
          cat >"$RUNNER_TEMP/zizmor-requirements.txt" <<'ZIZMOR_REQUIREMENTS'
          zizmor==1.33.1 \
              --hash=sha256:f4458e4d845075a2238aee01874d1fbab4e4ba3983d844415dcb4f7bcd61ee08 \
              --hash=sha256:eaaeb5c4c4947fe4a29d69e90f45cd31bd68a7cb99f3171e4d32199761cb8aba \
              --hash=sha256:0927b0f2f86d67a98444ae7fe2529963e29ffc3acff73e588f479f33361c926c \
              --hash=sha256:49eb92a95347e7da58c3123e4d5b297dbb6fe8ecc328e9db68df14c08e25e151 \
              --hash=sha256:3ed1dba4e9bbe590515a35359abbbe926c9cbd5f5fe52eb2f7e791250bdc536f \
              --hash=sha256:05d49c0ba1ba20531b1abe24d839dac3a6d5600d81944547015195d7cfccf336
          ZIZMOR_REQUIREMENTS
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps \
            -r "$RUNNER_TEMP/zizmor-requirements.txt"

      # The token enables the online audits: impostor commits, known-vulnerable
      # actions and version comments that do not match their SHA.
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .'
