name: zizmor

# Other repos call this workflow; it audits the calling repo's workflows, actions
# and dependabot config. Pinning zizmor here keeps one version across the org.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned: a replaced or added wheel on PyPI fails the install.
      # workspace:scripts/zizmor-all.sh reads this block, so keep the markers.
      - name: Install zizmor
        run: |
          cat >"$RUNNER_TEMP/zizmor-requirements.txt" <<'ZIZMOR_REQUIREMENTS'
          zizmor==1.32.0 \
              --hash=sha256:aa4b4e216321dd5cf202cd79fc83296468f0eed79d850cd65ac8187a6bbc5496 \
              --hash=sha256:0a999c98015becd9f69919ce01febadfb1c2be9b8ec2ce9ef7eb13ff23ba8eba \
              --hash=sha256:0cdd38fca6eb34ceb567548548d706332e3535ea66894b9168c048e03207b68c \
              --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071 \
              --hash=sha256:d34dcfa702875202b4163d90ebb9cc5222f3d1a7d4b72bf796d87b5a15b24194 \
              --hash=sha256:dd818f99d833b86cd432d5412d620d936b5df074b33404fff8b67acff55d3259
          ZIZMOR_REQUIREMENTS
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps \
            -r "$RUNNER_TEMP/zizmor-requirements.txt"

      # The token enables the online audits: impostor commits, known-vulnerable
      # actions and version comments that do not match their SHA.
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .'
