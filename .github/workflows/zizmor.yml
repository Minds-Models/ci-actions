name: zizmor

# Other repos call this workflow; it audits the calling repo's workflows, actions
# and dependabot config. Pinning zizmor here keeps one version across the org.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token enables the online audits: impostor commits, known-vulnerable
      # actions and version comments that do not match their SHA.
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format=github .
